name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate marketplace structure
        run: python scripts/validate_repo.py
      - name: Run deterministic tool tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python helpers
        run: python -m compileall -q plugins scripts tests
      - name: Check Playwright MCP launcher syntax
        run: node --check plugins/research-tools/scripts/run-playwright-mcp.mjs
